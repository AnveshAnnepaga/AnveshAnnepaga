<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 900 120"
  width="900"
  height="120"
  role="img"
  aria-label="AnveshAnnepaga — light banner"
>
  <title>AnveshAnnepaga — Light Banner</title>

  <defs>
    <linearGradient id="light-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
    <linearGradient id="light-name" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0369A1" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <filter id="l-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="900" height="120" fill="url(#light-bg)" />

  <!-- Subtle grid lines -->
  <g stroke="#E2E8F0" stroke-width="0.5" opacity="0.7">
    <line x1="0" y1="40"  x2="900" y2="40" />
    <line x1="0" y1="80"  x2="900" y2="80" />
    <line x1="0" y1="120" x2="900" y2="120" />
  </g>

  <!-- Accent left bar -->
  <rect x="40" y="25" width="3" height="70" fill="#0369A1" rx="1.5" opacity="0.9">
    <animate attributeName="height" values="0;70;70" dur="0.7s" begin="0.2s" fill="freeze" />
    <animate attributeName="y" values="60;25;25" dur="0.7s" begin="0.2s" fill="freeze" />
  </rect>

  <!-- Label -->
  <text x="60" y="48" font-family="'JetBrains Mono','Courier New',monospace"
    font-size="10" fill="#0369A1" letter-spacing="3" opacity="0">
    GITHUB PROFILE
    <animate attributeName="opacity" values="0;0.75" dur="0.5s" begin="0.4s" fill="freeze" />
  </text>

  <!-- Name -->
  <text x="60" y="82" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif"
    font-size="34" font-weight="700" fill="url(#light-name)" letter-spacing="-0.5" opacity="0">
    Anvesh Annepaga
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.6s" fill="freeze" />
  </text>

  <!-- Role -->
  <text x="60" y="102" font-family="'Inter','Segoe UI',Arial,sans-serif"
    font-size="12" fill="#475569" opacity="0">
    AI Systems Engineer · FastAPI · LangGraph
    <animate attributeName="opacity" values="0;0.9" dur="0.8s" begin="0.9s" fill="freeze" />
  </text>

  <!-- Right: status pill (light theme) -->
  <rect x="760" y="42" width="110" height="26" rx="13" fill="#EFF6FF" stroke="#0369A1"
    stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.1s" fill="freeze" />
  </rect>
  <circle cx="775" cy="55" r="4" fill="#0369A1" opacity="0">
    <animate attributeName="opacity" values="0;1;0.4;1" dur="2s" begin="1.3s" repeatCount="indefinite" />
  </circle>
  <text x="785" y="59" font-family="'JetBrains Mono','Courier New',monospace"
    font-size="10" fill="#0369A1" opacity="0">
    OPEN TO WORK
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.1s" fill="freeze" />
  </text>
</svg>
