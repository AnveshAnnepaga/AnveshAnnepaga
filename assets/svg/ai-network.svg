<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 900 400"
  width="900"
  height="400"
  role="img"
  aria-label="AI neural network background — dark"
>
  <title>AI Network — Dark</title>

  <defs>
    <linearGradient id="ai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#050816" />
      <stop offset="100%" stop-color="#0A1128" />
    </linearGradient>

    <!-- Pulse glow -->
    <filter id="pulse-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Edge glow (subtler) -->
    <filter id="edge-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Animated dash: signal travelling along an edge -->
    <linearGradient id="signal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00E5FF" stop-opacity="0" />
      <stop offset="50%"  stop-color="#00E5FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </linearGradient>

    <clipPath id="ai-clip">
      <rect width="900" height="400" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="400" fill="url(#ai-bg)" />

  <!-- ── LAYER 0: Grid (very faint) ── -->
  <g clip-path="url(#ai-clip)" stroke="#1E293B" stroke-width="0.5" opacity="0.5">
    <line x1="0"   y1="100" x2="900" y2="100" />
    <line x1="0"   y1="200" x2="900" y2="200" />
    <line x1="0"   y1="300" x2="900" y2="300" />
    <line x1="100" y1="0"   x2="100" y2="400" />
    <line x1="200" y1="0"   x2="200" y2="400" />
    <line x1="300" y1="0"   x2="300" y2="400" />
    <line x1="400" y1="0"   x2="400" y2="400" />
    <line x1="500" y1="0"   x2="500" y2="400" />
    <line x1="600" y1="0"   x2="600" y2="400" />
    <line x1="700" y1="0"   x2="700" y2="400" />
    <line x1="800" y1="0"   x2="800" y2="400" />
  </g>

  <!-- ── LAYER 1: Network edges ── -->
  <!--
    Node positions (logical — layers):
      Input:  A(80,100)  B(80,200)  C(80,300)
      Hidden1: D(260,60)  E(260,160) F(260,260) G(260,340)
      Hidden2: H(460,100) I(460,200) J(460,300)
      Output:  K(660,150) L(660,280)
      Dest:    M(820,200)
  -->
  <g clip-path="url(#ai-clip)" filter="url(#edge-glow)" opacity="0.22" stroke-width="1">
    <!-- Input → Hidden1 -->
    <line x1="80"  y1="100" x2="260" y2="60"  stroke="#00E5FF" />
    <line x1="80"  y1="100" x2="260" y2="160" stroke="#00E5FF" />
    <line x1="80"  y1="100" x2="260" y2="260" stroke="#3B82F6" />
    <line x1="80"  y1="200" x2="260" y2="60"  stroke="#3B82F6" />
    <line x1="80"  y1="200" x2="260" y2="160" stroke="#00E5FF" />
    <line x1="80"  y1="200" x2="260" y2="260" stroke="#00E5FF" />
    <line x1="80"  y1="200" x2="260" y2="340" stroke="#3B82F6" />
    <line x1="80"  y1="300" x2="260" y2="160" stroke="#3B82F6" />
    <line x1="80"  y1="300" x2="260" y2="260" stroke="#00E5FF" />
    <line x1="80"  y1="300" x2="260" y2="340" stroke="#00E5FF" />
    <!-- Hidden1 → Hidden2 -->
    <line x1="260" y1="60"  x2="460" y2="100" stroke="#00E5FF" />
    <line x1="260" y1="60"  x2="460" y2="200" stroke="#3B82F6" />
    <line x1="260" y1="160" x2="460" y2="100" stroke="#00E5FF" />
    <line x1="260" y1="160" x2="460" y2="200" stroke="#00E5FF" />
    <line x1="260" y1="160" x2="460" y2="300" stroke="#3B82F6" />
    <line x1="260" y1="260" x2="460" y2="100" stroke="#3B82F6" />
    <line x1="260" y1="260" x2="460" y2="200" stroke="#00E5FF" />
    <line x1="260" y1="260" x2="460" y2="300" stroke="#00E5FF" />
    <line x1="260" y1="340" x2="460" y2="200" stroke="#3B82F6" />
    <line x1="260" y1="340" x2="460" y2="300" stroke="#00E5FF" />
    <!-- Hidden2 → Output -->
    <line x1="460" y1="100" x2="660" y2="150" stroke="#00E5FF" />
    <line x1="460" y1="100" x2="660" y2="280" stroke="#3B82F6" />
    <line x1="460" y1="200" x2="660" y2="150" stroke="#00E5FF" />
    <line x1="460" y1="200" x2="660" y2="280" stroke="#00E5FF" />
    <line x1="460" y1="300" x2="660" y2="150" stroke="#3B82F6" />
    <line x1="460" y1="300" x2="660" y2="280" stroke="#00E5FF" />
    <!-- Output → Final -->
    <line x1="660" y1="150" x2="820" y2="200" stroke="#00E5FF" />
    <line x1="660" y1="280" x2="820" y2="200" stroke="#3B82F6" />
  </g>

  <!-- ── LAYER 2: Animated "signal" pulses ── -->
  <!-- Each pulse travels along one edge using animateTransform + opacity -->
  <!-- Signals along input→hidden1 layer -->
  <g clip-path="url(#ai-clip)" filter="url(#pulse-glow)">
    <!-- Signal 1: A→E -->
    <circle r="3" fill="#00E5FF" opacity="0">
      <animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1">
        <mpath xlink:href="#edge-AE" />
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.4s" begin="0s" repeatCount="indefinite" />
    </circle>

    <!-- Signal 2: B→F -->
    <circle r="3" fill="#3B82F6" opacity="0">
      <animateMotion dur="2.8s" begin="0.6s" repeatCount="indefinite">
        <mpath xlink:href="#edge-BF" />
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.8s" begin="0.6s" repeatCount="indefinite" />
    </circle>

    <!-- Signal 3: D→H -->
    <circle r="2.5" fill="#00E5FF" opacity="0">
      <animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite">
        <mpath xlink:href="#edge-DH" />
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.2s" begin="1.1s" repeatCount="indefinite" />
    </circle>

    <!-- Signal 4: E→I -->
    <circle r="3" fill="#7C3AED" opacity="0">
      <animateMotion dur="2.6s" begin="0.3s" repeatCount="indefinite">
        <mpath xlink:href="#edge-EI" />
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.6s" begin="0.3s" repeatCount="indefinite" />
    </circle>

    <!-- Signal 5: H→K -->
    <circle r="2.5" fill="#00E5FF" opacity="0">
      <animateMotion dur="2s" begin="1.5s" repeatCount="indefinite">
        <mpath xlink:href="#edge-HK" />
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2s" begin="1.5s" repeatCount="indefinite" />
    </circle>

    <!-- Signal 6: K→M -->
    <circle r="4" fill="#00E5FF" opacity="0">
      <animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite">
        <mpath xlink:href="#edge-KM" />
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.6s" begin="0.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Path definitions used by animateMotion (invisible) -->
  <defs>
    <path id="edge-AE" d="M80,100 L260,160" />
    <path id="edge-BF" d="M80,200 L260,260" />
    <path id="edge-DH" d="M260,60 L460,100" />
    <path id="edge-EI" d="M260,160 L460,200" />
    <path id="edge-HK" d="M460,100 L660,150" />
    <path id="edge-KM" d="M660,150 L820,200" />
  </defs>

  <!-- ── LAYER 3: Nodes (circles with pulse animation) ── -->
  <g clip-path="url(#ai-clip)" filter="url(#pulse-glow)">
    <!-- Input layer -->
    <circle cx="80"  cy="100" r="5" fill="#0F172A" stroke="#00E5FF" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.8;1;0.8" dur="3s" begin="0s" repeatCount="indefinite" />
    </circle>
    <circle cx="80"  cy="200" r="5" fill="#0F172A" stroke="#00E5FF" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.8;1;0.8" dur="3.5s" begin="0.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="80"  cy="300" r="5" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.8;1;0.8" dur="4s" begin="1s" repeatCount="indefinite" />
    </circle>

    <!-- Hidden layer 1 -->
    <circle cx="260" cy="60"  r="5" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="3.2s" begin="0.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="260" cy="160" r="6" fill="#0F172A" stroke="#00E5FF" stroke-width="2">
      <animate attributeName="r" values="6;7.5;6" dur="4s" begin="0s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.9;1;0.9" dur="4s" begin="0s" repeatCount="indefinite" />
    </circle>
    <circle cx="260" cy="260" r="5" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="3.8s" begin="0.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="260" cy="340" r="5" fill="#0F172A" stroke="#00E5FF" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="5s" begin="1.5s" repeatCount="indefinite" />
    </circle>

    <!-- Hidden layer 2 -->
    <circle cx="460" cy="100" r="5" fill="#0F172A" stroke="#00E5FF" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.8;1;0.8" dur="3.6s" begin="0.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="460" cy="200" r="7" fill="#0F172A" stroke="#3B82F6" stroke-width="2">
      <animate attributeName="r" values="7;9;7" dur="5s" begin="0.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="460" cy="300" r="5" fill="#0F172A" stroke="#7C3AED" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="4.2s" begin="2s" repeatCount="indefinite" />
    </circle>

    <!-- Output layer -->
    <circle cx="660" cy="150" r="6" fill="#0F172A" stroke="#00E5FF" stroke-width="2">
      <animate attributeName="r" values="6;8;6" dur="3s" begin="0.3s" repeatCount="indefinite" />
    </circle>
    <circle cx="660" cy="280" r="5" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="4s" begin="1.2s" repeatCount="indefinite" />
    </circle>

    <!-- Final output: large glowing node -->
    <circle cx="820" cy="200" r="8" fill="#0A1128" stroke="#00E5FF" stroke-width="2.5">
      <animate attributeName="r" values="8;11;8" dur="3s" begin="0s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="1;0.5;1" dur="3s" begin="0s" repeatCount="indefinite" />
    </circle>
    <!-- Inner glow dot -->
    <circle cx="820" cy="200" r="3" fill="#00E5FF" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" begin="0s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ── Layer labels ── -->
  <g font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#94A3B8" letter-spacing="1.5" opacity="0.6">
    <text x="60"  y="385" text-anchor="middle">INPUT</text>
    <text x="260" y="385" text-anchor="middle">HIDDEN</text>
    <text x="460" y="385" text-anchor="middle">HIDDEN</text>
    <text x="660" y="385" text-anchor="middle">OUTPUT</text>
    <text x="820" y="385" text-anchor="middle">RESULT</text>
  </g>
</svg>
